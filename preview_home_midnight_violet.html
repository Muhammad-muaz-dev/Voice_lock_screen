<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voice Lock · Home (Pixel-Perfect 1:1 Reference)</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #040711;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 0;
      font-family: 'Sora', system-ui, -apple-system, sans-serif;
    }
    .screen-frame {
      width: 390px;
      height: 844px;
      box-sizing: border-box;
      padding: 24px 20px 0;
      background: #0B1020;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85), 0 0 0 1px #232B4A;
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
    }
    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #5B3DF5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-title {
      flex: 1;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .btn-header {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 0;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .btn-header:active {
      transform: scale(0.93);
    }
    .btn-premium {
      background: #5B3DF5;
    }
    .btn-settings {
      border: 1px solid #232B4A;
      background: #151B33;
    }

    /* SECTION 1: VOICE CARDS */
    .cards-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }
    .card-unlock {
      background: linear-gradient(135deg, #5B3DF5, #7B2FD6);
      border: none;
      border-radius: 28px;
      padding: 18px;
      height: 168px;
      box-sizing: border-box;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-lock {
      background: #151B33;
      border: 1px solid #232B4A;
      border-radius: 28px;
      padding: 18px;
      height: 168px;
      box-sizing: border-box;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-row-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-badge-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-unlock .card-badge-icon {
      background: rgba(255, 255, 255, 0.2);
    }
    .card-lock .card-badge-icon {
      background: #2A2F5A;
    }
    .card-heading {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
    }

    /* SWITCHES (60x34px, 17px radius, 3px padding, 28px knob) */
    .toggle-switch {
      width: 60px;
      height: 34px;
      border-radius: 17px;
      border: 0;
      padding: 3px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: background 0.25s ease;
    }
    .card-unlock .toggle-switch {
      background: rgba(255, 255, 255, 0.3);
    }
    .card-lock .toggle-switch {
      background: #2A3050;
    }
    .switch-knob {
      width: 28px;
      height: 28px;
      border-radius: 14px;
      position: absolute;
      left: 3px;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), background 0.25s ease;
    }
    .card-unlock .switch-knob {
      background: #FFFFFF;
    }
    .card-lock .switch-knob {
      background: #A3A9C2;
    }
    .toggle-switch.is-active .switch-knob {
      transform: translateX(26px);
    }
    .card-unlock .toggle-switch.is-active {
      background: rgba(255, 255, 255, 0.85);
    }
    .card-unlock .toggle-switch.is-active .switch-knob {
      background: #5B3DF5;
    }
    .card-lock .toggle-switch.is-active {
      background: #5B3DF5;
    }
    .card-lock .toggle-switch.is-active .switch-knob {
      background: #FFFFFF;
    }

    /* BOTTOM SUB-PILL */
    .sub-pill {
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .card-unlock .sub-pill {
      background: rgba(255, 255, 255, 0.16);
    }
    .card-lock .sub-pill {
      background: #0F1428;
    }
    .pill-label {
      font-size: 11px;
      color: #FFFFFF;
    }
    .card-lock .pill-label {
      color: #A3A9C2;
    }
    .pill-value {
      font-size: 14px;
      font-weight: 700;
    }
    .pill-divider {
      width: 1px;
      height: 32px;
    }
    .card-unlock .pill-divider {
      background: rgba(255, 255, 255, 0.35);
    }
    .card-lock .pill-divider {
      background: #232B4A;
    }
    .pill-say-col {
      flex: 1;
    }
    .pill-phrase {
      font-size: 13px;
      font-weight: 600;
    }

    /* SECTION 2: 2x2 GRID */
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .grid-btn {
      background: #151B33;
      border: 1px solid #232B4A;
      border-radius: 22px;
      padding: 14px;
      height: 112px;
      box-sizing: border-box;
      text-align: left;
      color: #FFFFFF;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .grid-btn:active {
      transform: scale(0.97);
      border-color: #5B3DF5;
    }
    .grid-badge {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }
    .grid-desc {
      display: block;
      font-size: 11px;
      color: #A3A9C2;
      margin-top: 2px;
    }

    /* BOTTOM NAVIGATION */
    .bottom-navbar {
      margin: auto -20px 0;
      height: 84px;
      background: #11172B;
      border-top: 1px solid #232B4A;
      border-radius: 28px 28px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-sizing: border-box;
    }
    .nav-btn {
      border: 0;
      background: none;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #A3A9C2;
      font-size: 11px;
      min-width: 96px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #FFFFFF;
      font-weight: 700;
    }
    .active-tab-pill {
      width: 64px;
      height: 34px;
      border-radius: 17px;
      background: #5B3DF5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inactive-tab-slot {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="screen-frame">
    <!-- HEADER (Height 52px, gap 10px) -->
    <div class="header">
      <div class="header-logo">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v0M8 8v8M12 4v16M16 8v8M20 12v0"></path>
        </svg>
      </div>
      <div class="header-title">Voice Lock</div>
      <button class="btn-header btn-premium" aria-label="Go premium">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18h18l1-11-5 4-5-8-5 8-5-4z"></path>
        </svg>
      </button>
      <button class="btn-header btn-settings" aria-label="Settings">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path>
          <circle cx="16" cy="7" r="2"></circle>
          <circle cx="8" cy="17" r="2"></circle>
        </svg>
      </button>
    </div>

    <!-- SECTION 1: VOICE CARDS (Gap 14px, Margin-top 16px) -->
    <div class="cards-group">
      <!-- CARD 1: Unlock Screen (168px height) -->
      <div class="card-unlock">
        <div class="card-row-top">
          <div class="card-badge-icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="2"></rect>
              <path d="M8 11V8a4 4 0 017.5-2"></path>
            </svg>
          </div>
          <div class="card-heading">Unlock Screen</div>
          <button class="toggle-switch" id="btnSwitchUnlock" aria-label="Unlock Screen voice command">
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="sub-pill">
          <div>
            <div class="pill-label">Status</div>
            <div class="pill-value" id="valUnlockStatus">Inactive</div>
          </div>
          <div class="pill-divider"></div>
          <div class="pill-say-col">
            <div class="pill-label">Say</div>
            <div class="pill-phrase">“Hey, unlock my screen”</div>
          </div>
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v0M8 8v8M12 4v16M16 8v8M20 12v0"></path>
          </svg>
        </div>
      </div>

      <!-- CARD 2: Lock Screen (168px height) -->
      <div class="card-lock">
        <div class="card-row-top">
          <div class="card-badge-icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="2"></rect>
              <path d="M8 11V8a4 4 0 018 0v3"></path>
            </svg>
          </div>
          <div class="card-heading">Lock Screen</div>
          <button class="toggle-switch" id="btnSwitchLock" aria-label="Lock Screen voice command">
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="sub-pill">
          <div>
            <div class="pill-label">Status</div>
            <div class="pill-value" id="valLockStatus">Inactive</div>
          </div>
          <div class="pill-divider"></div>
          <div class="pill-say-col">
            <div class="pill-label">Say</div>
            <div class="pill-phrase">“Hey, lock my screen”</div>
          </div>
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v0M8 8v8M12 4v16M16 8v8M20 12v0"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- SECTION 2: 2x2 GRID (Gap 12px, Margin-top 16px, 112px height) -->
    <div class="tools-grid">
      <!-- 1. Open Camera -->
      <button class="grid-btn">
        <span class="grid-badge" style="background:#6D4AFF;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="13" rx="3"></rect>
            <circle cx="12" cy="13" r="3.5"></circle>
            <path d="M8 7l1.5-3h5L16 7"></path>
          </svg>
        </span>
        <span>
          <span class="grid-title">Open Camera</span>
          <span class="grid-desc">Use voice to open</span>
        </span>
      </button>

      <!-- 2. Pin Lock -->
      <button class="grid-btn">
        <span class="grid-badge" style="background:#0E8FA8;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V8a4 4 0 018 0v3"></path>
          </svg>
        </span>
        <span>
          <span class="grid-title">Pin lock</span>
          <span class="grid-desc">Lock with number pin</span>
        </span>
      </button>

      <!-- 3. Pattern Lock -->
      <button class="grid-btn">
        <span class="grid-badge" style="background:#D6336C;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2"></circle>
            <circle cx="18" cy="6" r="2"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <circle cx="6" cy="18" r="2"></circle>
            <circle cx="18" cy="18" r="2"></circle>
            <path d="M6 6l6 6 6-6M12 12l-6 6"></path>
          </svg>
        </span>
        <span>
          <span class="grid-title">Pattern lock</span>
          <span class="grid-desc">Draw to open lock</span>
        </span>
      </button>

      <!-- 4. Fingerprint Lock -->
      <button class="grid-btn">
        <span class="grid-badge" style="background:#C2570C;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 10a6 6 0 0112 0v3M9 20c1-2 1-4 1-7a2 2 0 014 0c0 3 0 5 1 7M6 14c0 3 0 4-1 6"></path>
          </svg>
        </span>
        <span>
          <span class="grid-title">Fingerprint</span>
          <span class="grid-desc">Lock with fingerprint</span>
        </span>
      </button>
    </div>

    <!-- BOTTOM NAVBAR (Height 84px, Radius 28px top, Margin -20px horizontal) -->
    <div class="bottom-navbar">
      <button class="nav-btn active">
        <span class="active-tab-pill">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V8a4 4 0 018 0v3"></path>
          </svg>
        </span>
        Voice Lock
      </button>

      <button class="nav-btn">
        <span class="inactive-tab-slot">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3A9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <path d="M9 4v16M3 10h6"></path>
          </svg>
        </span>
        Themes
      </button>

      <button class="nav-btn">
        <span class="inactive-tab-slot">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3A9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4h10l4 4v12H5z"></path>
            <path d="M9 13h6M9 17h4"></path>
          </svg>
        </span>
        Voice Note
      </button>
    </div>
  </div>

  <script>
    const switchUnlock = document.getElementById('btnSwitchUnlock');
    const valUnlockStatus = document.getElementById('valUnlockStatus');
    switchUnlock.addEventListener('click', () => {
      switchUnlock.classList.toggle('is-active');
      valUnlockStatus.textContent = switchUnlock.classList.contains('is-active') ? 'Active' : 'Inactive';
    });

    const switchLock = document.getElementById('btnSwitchLock');
    const valLockStatus = document.getElementById('valLockStatus');
    switchLock.addEventListener('click', () => {
      switchLock.classList.toggle('is-active');
      valLockStatus.textContent = switchLock.classList.contains('is-active') ? 'Active' : 'Inactive';
    });
  </script>
</body>
</html>
